version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - dlpas-network

  service1:
    build: ./service1
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - dlpas-network

  service2:
    build: ./service2
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "8083:8083"
    depends_on:
      - redis
    networks:
      - dlpas-network

  collector:
    build: ./Collector
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - dlpas-network

networks:
  dlpas-network:
    driver: bridge